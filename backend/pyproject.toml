[project]
name = "backend"
version = "0.2.0"
description = "Database management, data import, and API for muenster-jetzt"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asgiref>=3.12.1",
    "bleach>=6.4.0",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.1",
    "djangorestframework-camel-case>=1.4.2",
    "geopy>=2.5.0",
    "gunicorn>=26.2.0",
    "icalendar>=7.3.0",
    "inflection>=0.5.1",
    "markdown>=3.11",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scrapy>=2.19.0",
    "uritemplate>=4.2.0",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.54.0",
    "w3lib>=2.4.1",
]

[project.urls]
Homepage = "https://muenster-update.de/"

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# pycodestyle and Pyflakes, like flake8 did before
select = ["E", "F", "W"]
exclude = ["*/migrations/*"]

[tool.ty.src]
exclude = ["**/migrations"]
