version: 2

updates:
  # frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      frontend-dependencies:
        patterns:
          - *

  # github-actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions-dependencies:
        patterns:
          - *

  # backend
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      backend-dependencies:
        patterns:
          - *

  # docker compose / container images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      docker-dependencies:
        patterns:
          - *
