# Git hooks, install them with `prek install`
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-lock
        files: ^backend/(pyproject\.toml|uv\.lock)$
        args: [--project, backend]

  # Run ruff and ty from the backend environment, so their versions are the
  # ones pinned in backend/uv.lock
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true
      - id: ty
        name: ty check
        entry: uv run --directory backend --frozen ty check
        language: system
        files: ^backend/(.*\.pyi?|pyproject\.toml|uv\.lock)$
        pass_filenames: false
